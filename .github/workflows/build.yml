name: Build PS3
on:
  workflow_dispatch:
  push:
env:
  PS3DEV: /opt/ps3dev
  PSL1GHT: /opt/ps3dev
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar cache do toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: /opt/ps3dev
          key: ps3toolchain-v1

      - name: Instalar dependencias
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex build-essential \
            libelf-dev libgmp-dev libmpfr-dev libmpc-dev libncurses5-dev libssl-dev \
            libtool-bin pkg-config python3 texinfo wget zlib1g-dev patch bzip2 xz-utils git
          sudo mkdir -p /opt/ps3dev
          sudo chown -R $USER /opt/ps3dev

      - name: Compilar toolchain PS3 (so na primeira vez)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain/scripts
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          for s in 001-binutils-PPU.sh 002-gcc-newlib-PPU.sh 004-symlinks-PPU.sh \
                   005-binutils-SPU.sh 006-gcc-newlib-SPU.sh 008-psl1ght.sh; do
            echo "=== $s"; bash ./$s
          done

      - name: Salvar cache do toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/ps3dev
          key: ps3toolchain-v1

      - name: Extrair projeto
        run: unzip -q ULTRAKILL_PS3_Port_GitHubActions.zip -d src_tree

      - name: Compilar jogo
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          cd src_tree/ULTRAKILL_PS3_Port_Completo
          make
          CID=UP0001-ULTRAKILL_00-0000000000000000
          mkdir -p build/pkg/USRDIR
          cp $PS3DEV/bin/ICON0.PNG build/pkg/ICON0.PNG
          make_self_npdrm build/ultrakill_ps3.elf build/pkg/USRDIR/EBOOT.BIN $CID
          sfo --title "ULTRAKILL PS3" --appid ULTRAKILL -f $PS3DEV/bin/sfo.xml build/pkg/PARAM.SFO
          pkg --contentid $CID build/pkg/ build/ultrakill_ps3.pkg
          cp build/ultrakill_ps3.pkg build/ultrakill_ps3.gnpdrm.pkg
          package_finalize build/ultrakill_ps3.gnpdrm.pkg
